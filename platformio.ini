; Inkplate 5 Gen2 environment monitor.
;
; esp32       — the device: the awake loop over the epd libraries, reading the
;               four sensors over I2C.
; esp32-mock  — the same firmware with the simulated room in place of the
;               sensors (-DUSE_MOCK_SENSORS), so the loop can be flashed and
;               watched without the hardware attached.
; esp32-validate — the bench routine in src/validate/ instead of the awake
;               loop: which sensors answered, whether each reads sensibly
;               running and in low power, then ten seconds of deep sleep.
; native      — host tests for the room model, the sensor mocks, the drivers
;               against a fake I2C bus, the validation pass, and the loop's
;               timing.

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
; Two 1.75 MB app slots and a 384 kB filesystem. See partitions.csv.
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<defaults.example.cpp> -<sim/> -<validate/>
; Derives CLIENT_VERSION from git describe. See scripts/version.py.
extra_scripts = pre:scripts/version.py
; Local checkouts during development. For a pinned release, swap these for:
;   https://github.com/chrisjtwomey/epd.git#v0.1.0
; YAML config loading is only reachable on the USE_SDCARD path, so the two
; parsers are declared here rather than as dependencies of EpdClient.
lib_deps =
	symlink://../epd/firmware
	symlink://../epd/firmware/boards/inkplate
	tobozo/YAMLDuino @ ^1.5.0
	https://github.com/bblanchon/ArduinoStreamUtils.git#v1.9.2
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE5V2
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCLIENT_NAME='"inkplate5-env-monitor"'
	-DUSE_SDCARD
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-DLOG_LEVEL=5

[env:esp32-mock]
extends = env:esp32
build_flags =
	${env:esp32.build_flags}
	-DUSE_MOCK_SENSORS

[env:esp32-validate]
; No network and no credentials, so this one builds without src/defaults.cpp.
extends = env:esp32
build_src_filter = ${env:esp32.build_src_filter} +<validate/> -<main.cpp> -<defaults.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++14 -Iinclude -DNATIVE
build_src_filter = +<sensors/**> +<net/**>

[env:sim]
; The sensor loop on the host: same mocks, same SensorSuite, no Arduino.
;   pio run -e sim && .pio/build/sim/program --help
platform = native
build_flags = -std=c++14 -Iinclude -DNATIVE -DUSE_MOCK_SENSORS
build_src_filter = +<sensors/**> +<sim/>
