; Inkplate 5 Gen2 environment monitor.
;
; esp32   — the device. Mocks stand in for the sensors until the hardware
;           arrives (-DUSE_MOCK_SENSORS). The epd libraries are added when
;           the awake loop lands (ARCHITECTURE.md §7, step 4).
; native  — host tests for the room model and the sensor mocks.

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<defaults.example.cpp> -<sim/>
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE5V2
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCLIENT_NAME='"inkplate5-env-monitor"'
	-DCLIENT_VERSION='"v0.1.0-dev"'
	-DLOG_LEVEL=5
	-DUSE_MOCK_SENSORS

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++14 -Iinclude -DNATIVE
build_src_filter = +<sensors/**>

[env:sim]
; The sensor loop on the host: same mocks, same SensorSuite, no Arduino.
;   pio run -e sim && .pio/build/sim/program --help
platform = native
build_flags = -std=c++14 -Iinclude -DNATIVE -DUSE_MOCK_SENSORS
build_src_filter = +<sensors/**> +<sim/>
