; CANARY: an indoor air-quality monitor on an Inkplate 5 Gen2.
;
; esp32       — the head: the Inkplate fetching and drawing the pages the server
;               renders, and posting its own state.
; dock        — the dock: a TinyS3 that reads the four sensors and posts them.
; dock-mock   — the dock with the simulated room in place of the sensors
;               (-DUSE_MOCK_SENSORS), so the loop can be flashed and watched
;               without the hardware attached.
; esp32-validate — the bench routine in src/validate/ on an Inkplate with the
;               sensor chain on its easyC socket: which sensors answered, whether
;               each reads sensibly running and in low power, then ten seconds
;               of deep sleep.
; native      — host tests for the room model, the sensor mocks, the drivers
;               against a fake I2C bus, the validation pass, and the loop's
;               timing.

[platformio]
default_envs = esp32

[env:esp32]
; Pinned to the version the bench builds used. A fresh install otherwise takes
; the newest, and CI and firmware-builder would build something no board has
; run.
platform = espressif32 @ 7.0.1
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
; Two 1.75 MB app slots and a 384 kB filesystem. See partitions.csv.
board_build.partitions = partitions.csv
; The notices the head draws when it cannot show a page, rendered by the
; server's pipeline (scripts/notices.py) so they look like pages.
board_build.embed_files =
	include/head/notices/notice-unreachable.png
	include/head/notices/notice-version.png
	include/head/notices/notice-no-firmware.png
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<defaults.example.cpp> -<sim/> -<validate/> -<dock/> -<sensors/>
; The first derives CLIENT_VERSION from git describe (scripts/version.py);
; the second links Bosch's BSEC2 binary (scripts/bsec.py).
extra_scripts =
	pre:scripts/version.py
	pre:scripts/bsec.py
; Local checkouts during development. For a pinned release, swap these for:
;   https://github.com/chrisjtwomey/epd.git#v0.1.0
; YAML config loading is only reachable on the USE_SDCARD path, so the two
; parsers are declared here rather than as dependencies of EpdClient.
; BSEC2 is Bosch's closed-source IAQ library, under Bosch's clickthrough
; licence (docs/HARDWARE.md 4). lib_ignore keeps its Arduino wrapper out of
; the build, and scripts/bsec.py links the binary alone.
lib_deps =
	symlink://../epd/firmware
	symlink://../epd/firmware/boards/inkplate
	tobozo/YAMLDuino @ ^1.5.0
	https://github.com/bblanchon/ArduinoStreamUtils.git#v1.9.2
	boschsensortec/bsec2 @ 1.10.2610
lib_ignore = bsec2
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DARDUINO_INKPLATE5V2
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCLIENT_NAME='"canary-head"'
	-DEPD_HEADER_PREFIX='"Canary"'
	-DUSE_SDCARD
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
	-DLOG_LEVEL=5

[env:dock]
; The dock's board. Each environment compiles its own files, so no flag decides
; what a board runs: the dock takes src/dock/, the head everything but that.
platform = espressif32 @ 7.0.1
framework = arduino
board = um_tinys3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<dock/> +<sensors/**> +<net/**> +<defaults.cpp>
; The kit's WiFi, HTTP, time and logging helpers. Not its board or client:
; the dock has no panel, and none of those helpers needs an IBoard.
; BSEC2 as in the head's environment: the package is installed, its Arduino
; wrapper ignored, and scripts/bsec.py links the binary for this board's core.
lib_deps =
	symlink://../epd/firmware
	boschsensortec/bsec2 @ 1.10.2610
lib_ignore = bsec2
extra_scripts =
	pre:scripts/version.py
	pre:scripts/bsec.py
build_flags =
	-DCLIENT_NAME='"canary-dock"'
	-DEPD_HEADER_PREFIX='"Canary"'
	-DBOARD_HAS_PSRAM
	-DLOG_LEVEL=5

[env:dock-mock]
; The dock with the simulated room in place of the sensors, so the loop can be
; flashed and watched with nothing on the bus.
extends = env:dock
build_flags =
	${env:dock.build_flags}
	-DUSE_MOCK_SENSORS

[env:esp32-validate]
; No network and no credentials, so this one builds without src/defaults.cpp.
extends = env:esp32
build_src_filter = ${env:esp32.build_src_filter} +<validate/> +<sensors/**> -<main.cpp> -<defaults.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++14 -Iinclude -DNATIVE
build_src_filter = +<sensors/**> +<net/**>

[env:sim]
; The sensor loop on the host: same mocks, same SensorSuite, no Arduino.
;   pio run -e sim && .pio/build/sim/program --help
platform = native
build_flags = -std=c++14 -Iinclude -DNATIVE -DUSE_MOCK_SENSORS
build_src_filter = +<sensors/**> +<sim/>
