# Copy to config.yaml. Every key can be set by an environment variable
# too: server.port becomes SERVER_PORT.

server:
  port: 8080
  timezone: Europe/Dublin
  regen_lead_seconds: 60

# What the display shows, and when. Each pool is a list of images read in
# turn on its own count, from a random start that moves every
# `reshuffle_hours`, so one pass is never all traces or all deltas. The
# schedule visits the pools in `order` (default: as listed) at each slot of
# its week.
display:
  pools:
    co2: [breathe.png, co2-trace.png, co2-delta.png]
    comfort: [comfort.png, comfort-trace.png, comfort-delta.png]
    dust: [dust.png, dust-trace.png, dust-delta.png]
    air: [air.png, air-trace.png, air-delta.png]
    pressure: [barometer-trace.png, barometer-delta.png]
    day: [day.png]
    diagnostics: [diagnostics.png, diagnostics-trace.png, health-trace.png]
  schedule:
    type: timeranges
    week:           # when the page changes, in server.timezone: each day is in one group, and
                    # each range runs until the next starts that day, slots on the wall clock
                    # (:00, :05 ...); every: 0 is off
      - days: [mon, tue, wed, thu, fri, sat, sun]
        ranges:
          - {from: "00:00", every: 300}
    reshuffle_hours: 3
  sync:             # when the display sends its state and takes any update, beside each page it fetches
    every: 1800     # seconds, on the wall clock from midnight; 0 for only beside each page

image:
  width: 1280
  height: 720

source:
  kind: mock        # mock: the simulated room; store: what the board posts
  seed: 7           # mock only
  # path: data/sensor-readings.db  # store only; relative to this file
  # keep_days: 0        # store only; readings older than this are deleted, 0 keeps all

status:             # what each board says about itself, kept as readings are
  # path: data/status.db   # relative to this file
  keep_days: 7        # older reports are deleted, 0 keeps all

calibration:        # sensor state the dock backs up after each batch of readings
  # path: data/calibration.db  # relative to this file
  keep_days: 3      # each copy is kept this long; the board asks for one after a restart

dock:               # what the dock does between readings; it takes a change before its next one
  sync:             # when it takes a reading and syncs, in server.timezone
    week:           # each day is in one group, and each range runs until the next starts that
                    # day, slots on the wall clock (:00, :05 ...); every: 0 is off
      - days: [mon, tue, wed, thu, fri, sat, sun]
        ranges:
          - {from: "01:00", every: 1800}
          - {from: "07:00", every: 300}
  pm:
    warmup_s: 35    # the fan runs this long before each reading; 0 keeps it on
    poor_air_ug_m3: 37.5        # PM2.5 from which the light's poor_air_quality trigger holds
  scd41:
    temperature_offset_c: 4.0   # the dock's own heat, taken off the CO2 sensor's temperature
    self_calibration: true      # takes the lowest reading of each week as fresh air
    poor_air_ppm: 1500          # CO2 from which the light's poor_air_quality trigger holds
    warmup_s: 180               # seconds after each start without its temperature; 0 keeps all
  shtc3:
    low_power: false
  led:
    brightness_pct: 15
    smoothness: 3   # the steps of light in each fade: 1 to 5 for 4, 8, 16, 32 or 64; 6 for smooth
    schedule: {}    # the hours the light is on, as {from: "07:00", to: "01:00"}; {} for all day
    # A look for each trigger: "off" (in quotes), solid, blip, pulse,
    # double_pulse, triple_pulse, swell, ramp, flash, double_flash or
    # triple_flash, with length_s, one cycle of it (0.25 to 10 s; a double at
    # least 0.9, a triple 1.2). A double or a triple is 2 or 3 quick pulses or
    # flashes of 0.3 s, then dark for the rest of the length. The dock shows
    # the first trigger that holds and has a look, in this order; one left out
    # is skipped. error is anything wrong, which the Boards page names;
    # running holds once the dock has booted.
    looks:
      - {trigger: booting, pattern: pulse, length_s: 0.5}
      - {trigger: error, pattern: flash, length_s: 1}
      - {trigger: poor_air_quality, pattern: double_flash, length_s: 2}
      - {trigger: calibrating, pattern: swell, length_s: 4}
      - {trigger: running, pattern: pulse, length_s: 1}
  bsec:
    sample_s: 300   # BSEC's air quality sample: 3 or 300 s; a change starts its learning again
    poor_air_iaq: 150           # IAQ from which the light's poor_air_quality trigger holds
  log:
    level: debug    # error, warning, notice, info or debug

site:
  altitude_m: 10    # pressure is reduced to sea level, as forecasts quote it

client:             # what the board runs, not what this server does
  firmware:         # server-driven updates; the board flashes itself
    enabled: false
    dir: firmware   # canary-display/ and canary-dock/, each of <version>.bin; every board is
                    # offered the newest its product has that works with this server's version

mqtt:               # each board logs to <prefix>/<board>; the Logs view shows them
  enabled: false
  host: localhost
  port: 1883
  prefix: mqtt/canary

logs:               # what each board logs over MQTT, kept for the Logs view
  # path: data/board-logs.db # relative to this file
  keep_days: 7        # older lines are deleted, 0 keeps all

debug: false
