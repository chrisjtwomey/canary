# Copy to config.yaml. Every key can be set by an environment variable
# too: server.port becomes SERVER_PORT.

server:
  port: 8080
  timezone: Europe/Dublin
  regen_lead_seconds: 60

# The client fetches a page every `every` seconds, on the wall clock
# (:00, :05, :10 ...). The pools are visited round-robin, and each pool is
# read round-robin on its own count from a random start, so one pass is
# never all traces or all deltas; the starts move every `reshuffle_hours`.
# A mapping of HH:MM:SS to page, or `every` with a `pages` list, works too.
display_schedule:
  every: 300
  reshuffle_hours: 3
  pools:
    co2: [breathe.png, co2-trace.png, co2-delta.png]
    comfort: [comfort.png, comfort-trace.png, comfort-delta.png]
    dust: [dust.png, dust-trace.png, dust-delta.png]
    air: [air.png, air-trace.png, air-delta.png]
    pressure: [barometer-trace.png, barometer-delta.png]
    day: [day.png]
    diagnostics: [diagnostics.png]

image:
  width: 1280
  height: 720

source:
  kind: mock        # the simulated room; the readings store comes later
  seed: 7

site:
  altitude_m: 10    # pressure is reduced to sea level, as forecasts quote it

mqtt:
  enabled: false

debug: false
