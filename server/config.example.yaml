# Copy to config.yaml. Every key can be set by an environment variable
# too: server.port becomes SERVER_PORT.

server:
  port: 8080
  timezone: Europe/Dublin
  regen_lead_seconds: 60

# What the client shows, and when. Each pool is a list of images read in
# turn on its own count, from a random start that moves every
# `reshuffle_hours`, so one pass is never all traces or all deltas. The
# schedule visits the pools in `order` (default: as listed) every `every`
# seconds on the wall clock (:00, :05, :10 ...).
display:
  pools:
    co2: [breathe.png, co2-trace.png, co2-delta.png]
    comfort: [comfort.png, comfort-trace.png, comfort-delta.png]
    dust: [dust.png, dust-trace.png, dust-delta.png]
    air: [air.png, air-trace.png, air-delta.png]
    pressure: [barometer-trace.png, barometer-delta.png]
    day: [day.png]
    diagnostics: [diagnostics.png, diagnostics-trace.png, health-trace.png]
  schedule:
    type: interval
    every: 300
    reshuffle_hours: 3

image:
  width: 1280
  height: 720

source:
  kind: mock        # mock: the simulated room; store: what the board posts
  seed: 7           # mock only
  # path: sensor-readings.db  # store only; relative to this file
  # keep_days: 0        # store only; readings older than this are deleted, 0 keeps all

status:             # what each board says about itself, kept as readings are
  # path: status.db   # relative to this file
  keep_days: 7        # older reports are deleted, 0 keeps all

calibration:        # sensor state the dock backs up whenever BSEC saves a copy
  # path: calibration.db  # relative to this file
  keep_days: 3      # each copy is kept this long; the board asks for one after a restart

posts:              # when the dock posts its readings, on the wall clock (:00, :05, :10 ...)
  every: 300
  quiet:            # a slower cadence overnight, in server.timezone; `quiet: {}` turns it off
    from: "01:00"
    to: "07:00"
    every: 1800

dock:               # what the dock does between readings; it takes a change before its next one
  pm:
    warmup_s: 35    # the fan runs this long before each reading; 0 keeps it on
  scd41:
    temperature_offset_c: 4.0   # the dock's own heat, taken off the CO2 sensor's temperature
    self_calibration: true      # takes the lowest reading of each week as fresh air
  shtc3:
    low_power: false
  led:
    brightness_pct: 15
    off_in_quiet_hours: false   # dark from the pre-warm before the first quiet slot
  bsec:
    sample_s: 300   # BSEC's air quality sample: 3 or 300 s; a change starts its learning again
  log:
    level: debug    # error, warning, notice, info or debug

site:
  altitude_m: 10    # pressure is reduced to sea level, as forecasts quote it

client:             # what the board runs, not what this server does
  firmware:         # server-driven updates; the board flashes itself
    enabled: false
    dir: firmware   # canary-head/ and canary-dock/, each of <version>.bin; every board is
                    # offered the newest its product has that works with this server's version

mqtt:               # each board logs to <prefix>/<board>; the Logs view shows them
  enabled: false
  host: localhost
  port: 1883
  prefix: mqtt/canary

logs:               # what each board logs over MQTT, kept for the Logs view
  # path: board-logs.db # relative to this file
  keep_days: 7        # older lines are deleted, 0 keeps all

debug: false
