# Copy to config.yaml. Every key can be set by an environment variable
# too: server.port becomes SERVER_PORT.

server:
  port: 8080
  timezone: Europe/Dublin
  regen_lead_seconds: 60

# What the client shows, and when. Each pool is a list of images read in
# turn on its own count, from a random start that moves every
# `reshuffle_hours`, so one pass is never all traces or all deltas. The
# schedule visits the pools in `order` (default: as listed) every `every`
# seconds on the wall clock (:00, :05, :10 ...).
display:
  pools:
    co2: [breathe.png, co2-trace.png, co2-delta.png]
    comfort: [comfort.png, comfort-trace.png, comfort-delta.png]
    dust: [dust.png, dust-trace.png, dust-delta.png]
    air: [air.png, air-trace.png, air-delta.png]
    pressure: [barometer-trace.png, barometer-delta.png]
    day: [day.png]
    diagnostics: [diagnostics.png]
  schedule:
    type: interval
    every: 300
    reshuffle_hours: 3

image:
  width: 1280
  height: 720

source:
  kind: mock        # mock: the simulated room; store: what the board posts
  seed: 7           # mock only
  # path: readings.db   # store only; relative to this file
  # keep_days: 0        # store only; readings older than this are deleted, 0 keeps all

calibration:        # sensor state the board backs up with each reading
  # path: calibration.db  # relative to this file
  keep_days: 3      # each copy is kept this long; the board asks for one after a restart

site:
  altitude_m: 10    # pressure is reduced to sea level, as forecasts quote it

client:             # what the board runs, not what this server does
  firmware:         # server-driven updates; the board flashes itself
    enabled: false
    dir: firmware   # a directory of <version>.bin, newest wins
    offer_dev_builds: false # true offers to boards not built from a tag
    # source:               # optional: fill dir from a repository's releases
    #   github: chrisjtwomey/inkplate5-env-monitor
    #   asset: firmware.bin
    #   token: ""           # private repo; prefer CLIENT_FIRMWARE_SOURCE_TOKEN

mqtt:
  enabled: false
  host: localhost
  port: 1883
  topic: mqtt/env-monitor

debug: false
