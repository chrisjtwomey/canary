# Copy to config.yaml. Every key can be set by an environment variable
# too: server.port becomes SERVER_PORT.

server:
  port: 8080
  timezone: Europe/Dublin
  regen_lead_seconds: 60

# The client fetches a page every `every` seconds, on the wall clock
# (:00, :05, :10 ...), taking `pages` in turn. A mapping of HH:MM:SS to
# page works too, as in the weather calendar.
display_schedule:
  every: 300
  pages: [breathe.png, comfort.png, day.png, dust.png, air.png, barometer.png, diagnostics.png]

image:
  width: 1280
  height: 720

source:
  kind: mock        # the simulated room; the readings store comes later
  seed: 7

mqtt:
  enabled: false

debug: false
