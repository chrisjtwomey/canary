name: Images

# Every push to main that passes CI publishes both images as `latest`, which a
# server's stack follows. A published release publishes them as its version
# and as `latest`. A tag push publishes nothing.
on:
  workflow_run:
    workflows: [PlatformIO CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

# The server image, and the image that builds firmware for it. Unlike
# weather-cal, no job attaches firmware.bin: a firmware image carries Bosch's
# BSEC binary, and this project never publishes one. firmware-builder
# downloads BSEC and builds on the machine that runs it.
jobs:
  publish-docker:
    name: Push ${{ matrix.image }} to GHCR
    # A push only: CI also runs for a pull request, whose branch can be called
    # main too, and this job can write packages.
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: canary-server
            context: ./server
            file: ./server/Dockerfile
          - image: canary-firmware-builder
            context: .
            file: ./firmware-builder/Dockerfile

    steps:
      # A workflow_run starts on main's newest commit, so take the one CI
      # passed. Empty for a release, which takes its tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # git describe needs the tags

      # A release publishes `latest` too, so it needs the CI pass that a push
      # waits for: a PlatformIO CI run on its commit that succeeded.
      - name: Check that CI passed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh api "repos/$REPO/actions/workflows/build.yaml/runs?head_sha=$sha&status=success" -q .total_count)
          if [ "$passed" = 0 ]; then
            echo "::error::PlatformIO CI has not passed on $sha"
            exit 1
          fi

      # The version the server reports: what git describe says, as a checkout
      # run by hand would. On a release's commit that is the tag alone; another
      # tag on the same commit could win, so a release checks it gets its own.
      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(git describe --tags --match 'v*' --always)
          if [ -n "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::git describe gives $version, not the release's $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # The commit built, not main's newest.
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CANARY_VERSION=${{ steps.version.outputs.version }}
