name: Release

on:
  release:
    types: [published]

# The server image, and the image that builds firmware for it. Unlike
# weather-cal, no job attaches firmware.bin: a firmware image carries Bosch's
# BSEC binary, and this project never publishes one. firmware-builder
# downloads BSEC and builds on the machine that runs it.
jobs:
  publish-docker:
    name: Push ${{ matrix.image }} to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: canary-server
            context: ./server
            file: ./server/Dockerfile
          - image: canary-firmware-builder
            context: .
            file: ./firmware-builder/Dockerfile

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CANARY_VERSION=${{ github.event.release.tag_name }}
