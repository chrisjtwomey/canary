name: PlatformIO CI

on: [push, pull_request]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canary

    steps:
      # epd comes from the PlatformIO registry, at the version platformio.ini
      # pins. The client's own tests live in epd and run in its CI.
      - uses: actions/checkout@v6
        with:
          path: canary
          # Tags, so scripts/version.py can derive CLIENT_VERSION.
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio-canary-dock/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('canary/platformio.ini') }}
      # The IDF libraries the dock's custom_sdkconfig compiles, which take
      # about six minutes. pioarduino skips the compile when the first line of
      # the project's sdkconfig.defaults holds the hash of the options, so that
      # file is kept with them. platformio.ini holds the options and the
      # platform version.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio-canary-dock/packages/framework-arduinoespressif32-libs
            canary/sdkconfig.defaults
          key: ${{ runner.os }}-dock-idf-${{ hashFiles('canary/platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Create defaults.cpp from example
        run: cp src/defaults.example.cpp src/defaults.cpp

      - name: Build the display
        run: pio run -e esp32

      # Both sensor paths, plus the bench routine that runs instead of the
      # awake loop: the drivers the board runs, the mocks that stand in when
      # nothing is attached, and the wiring check. In a PlatformIO folder of
      # its own (CONTRIBUTING.md, Building the dock).
      - name: Build the dock
        run: PLATFORMIO_CORE_DIR=~/.platformio-canary-dock pio run -e dock -e dock-mock -e dock-validate

      # This project's own logic, on the host: the room model, the sensor
      # mocks, the drivers against a fake I2C bus, the suite that reads
      # them, the validation pass, and the loop's timing.
      - name: Run host tests
        run: pio test -e native

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6
        with:
          # Tags, so server_version() describes the checkout the way it does
          # on a machine. Without them git describe --always returns a bare
          # SHA, which is not a version.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
