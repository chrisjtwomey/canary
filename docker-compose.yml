services:
  canary-server:
    image: ghcr.io/chrisjtwomey/canary-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      # HTTPS, for the install page. The page links to it by this number, so
      # keep the same number on both sides.
      - "8443:8443"
    volumes:
      # Without it the image runs its example config, the simulated room.
      # README.md, "Run the server", says which keys a deployment sets. Writable,
      # so /web/config can save it: the container's user (uid 1000) must be
      # able to write the host file. Mount it :ro to allow checks only.
      - ./server/config.yaml:/app/config.yaml
      # The four stores: readings, board reports, board logs and calibration,
      # and the HTTPS port's certificate.
      # A named volume, not a host path: the container runs as uid 1000 and
      # could not write to a directory the host owns.
      - canary-data:/app/data
      # Firmware images, from firmware-builder: canary-display/ and canary-dock/,
      # each with <version>.bin and <version>.merged.bin. Create the directory
      # before the first start, or Docker makes it as root and neither can
      # write to it. The server only reads it.
      - ./server/firmware:/app/firmware:ro

  # Builds the firmware of the commit its image was built from into
  # server/firmware, so the boards follow this server. Keep its tag the same
  # as the server's. See docs/releases.md.
  firmware-builder:
    image: ghcr.io/chrisjtwomey/canary-firmware-builder:latest
    restart: unless-stopped
    # Must be able to write server/firmware on the host.
    user: "1000:1000"
    volumes:
      - ./server/firmware:/firmware
      # The PlatformIO toolchain, downloaded by the first build.
      - platformio:/platformio

  # Writes server/config.yaml and server/firmware for a first start, as root,
  # so the host needs no sudo. setup.sh runs it; `docker compose up` does not.
  setup:
    image: ghcr.io/chrisjtwomey/canary-server:latest
    profiles: [setup]
    user: "0:0"
    volumes:
      - ./server:/setup
    command: ["python", "setup.py", "/setup"]

volumes:
  canary-data:
  platformio:
