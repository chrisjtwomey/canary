services:
  canary-server:
    image: ghcr.io/chrisjtwomey/canary-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Without it the image runs its example config, the simulated room.
      # CONTRIBUTING.md, Releases, says which keys a deployment sets. Writable,
      # so /web/config can save it: the container's user (uid 1000) must be
      # able to write the host file. Mount it :ro to allow checks only.
      - ./server/config.yaml:/app/config.yaml
      # The readings and calibration stores. A named volume, not a host path:
      # the container runs as uid 1000 and could not write to a directory the
      # host owns.
      - canary-data:/app/data
      # Firmware images, from firmware-builder or scripts/build-firmware.sh:
      # canary-head/ and canary-dock/, each of <version>.bin. Create the
      # directory before the first start, or Docker makes it as root and
      # neither can write to it. The server only reads it.
      - ./server/firmware:/app/firmware:ro

  # Builds each new release's firmware into server/firmware. See
  # CONTRIBUTING.md, Releases.
  firmware-builder:
    image: ghcr.io/chrisjtwomey/canary-firmware-builder:latest
    restart: unless-stopped
    # Must be able to write server/firmware on the host.
    user: "1000:1000"
    environment:
      # Only a tag this key signed is built, since the board flashes whatever
      # the server offers.
      SIGNED_BY: "878D72349B08E6610A678B88614344BCB54CC36E"
      POLL_SECONDS: "900"
    volumes:
      - ./server/firmware:/firmware
      # The PlatformIO toolchain, downloaded by the first build.
      - platformio:/platformio

volumes:
  canary-data:
  platformio:
